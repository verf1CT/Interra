# Защищённый обратный прокси для биллинга и личного кабинета stat.interra.ru
# Устанавливается перед устаревшим Apache 2.2 (который слушает только 127.0.0.1:8080)
#
# Путь для установки на сервере:
# /etc/nginx/sites-available/stat.interra.ru.conf -> /etc/nginx/sites-enabled/

# Ограничение частоты запросов (защита от DoS и перебора паролей)
limit_req_zone $binary_remote_addr zone=utm_general:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=utm_login:10m rate=5r/s;

# 1. Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name stat.interra.ru;

    # Скрытие версии Nginx
    server_tokens off;

    # Путь для проверки Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Основной защищённый HTTPS хост
server {
    listen 443 ssl http2;
    server_name stat.interra.ru;

    # Скрытие версии Nginx и серверных сигнатур
    server_tokens off;

    # SSL сертификаты (Let's Encrypt или корпоративный сертификат)
    ssl_certificate     /etc/letsencrypt/live/stat.interra.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stat.interra.ru/privkey.pem;

    # Безопасный SSL/TLS стек: ТОЛЬКО TLS 1.2 и 1.3 (блокирует Heartbleed, CCS, POODLE)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Кэширование SSL сессий
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Заголовки безопасности (Security Headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Скрытие внутренних заголовков Apache и устаревшего ПО
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    add_header Server "webserver" always;

    # Блокировка доступа к скрытым и служебным файлам (.git, .env, бэкапы)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Блокировка попыток сканирования типовых дыр CMS
    location ~* \.(sql|bak|old|tar|gz|zip|env)$ {
        deny all;
    }

    # Защита эндпоинта аутентификации (форма логина UTM5)
    location ~ ^/cgi-bin/utm5/(aaa|bbb)$ {
        limit_req zone=utm_login burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Проксирование всего остального контента ЛК на локальный Apache
    location / {
        limit_req zone=utm_general burst=40 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}
