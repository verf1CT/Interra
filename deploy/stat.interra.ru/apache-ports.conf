# Конфигурация портов Apache 2.2 для stat.interra.ru
# Файл заменяет /etc/apache2/ports.conf
#
# ВНИМАНИЕ: Apache больше НЕ должен слушать внешние интерфейсы 0.0.0.0:80 и 0.0.0.0:443.
# Он привязывается исключительно к локальному интерфейсу 127.0.0.1:8080.
# Весь входящий трафик снаружи принимает и фильтрует Nginx.

Listen 127.0.0.1:8080

# Порт 443 для SSL в Apache отключается: SSL полностью отдаётся Nginx
# <IfModule ssl_module>
#     Listen 443
# </IfModule>
