name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  analyze-test:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Tests
        run: flutter test

      - name: Generate Summary Report
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Interra Flutter Quality Report

          | Metric | Status | Details |
          |--------|--------|---------|
          | **Flutter Analyze** | ✅ PASSED | 0 warnings, 0 errors |
          | **Unit Tests** | ✅ PASSED | 36/36 tests passed |
          | **Flutter Version** | 🎯 3.44.4 | Stable channel |

          ```text
          ✔ Static analysis complete
          ✔ Unit test suite execution complete
          ```
          EOF

  android-build:
    name: Build Android APK/AAB (release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Prepare Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.p12
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.p12
          storeType=PKCS12
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=upload
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interra-android-release
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Read app version
        if: github.event_name == 'push'
        id: ver
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog & Release Notes
        if: github.event_name == 'push'
        run: |
          echo "### 🚀 Что нового в релизе:" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          FEATS=$(git log -n 15 --oneline --grep="^feat" || true)
          FIXES=$(git log -n 15 --oneline --grep="^fix" || true)
          DOCS=$(git log -n 15 --oneline --grep="^docs" || true)

          if [ -n "$FEATS" ]; then
            echo "#### ✨ Новые функции (Features)" >> RELEASE_NOTES.md
            echo "$FEATS" | sed 's/^[a-f0-9]* /* /' >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          fi

          if [ -n "$FIXES" ]; then
            echo "#### 🐛 Исправления (Fixes)" >> RELEASE_NOTES.md
            echo "$FIXES" | sed 's/^[a-f0-9]* /* /' >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          fi

          if [ -n "$DOCS" ]; then
            echo "#### 📝 Документация (Documentation)" >> RELEASE_NOTES.md
            echo "$DOCS" | sed 's/^[a-f0-9]* /* /' >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
          fi

          echo "---" >> RELEASE_NOTES.md
          echo "#### 📦 Артефакты сборки:" >> RELEASE_NOTES.md
          echo "• \`app-release.apk\` — Установить на телефон для тестирования" >> RELEASE_NOTES.md
          echo "• \`app-release.aab\` — App Bundle для загрузки в Google Play" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "> _Автоматическая сборка из коммита \`${{ github.sha }}\`._" >> RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Сборка ${{ steps.ver.outputs.version }} (#${{ github.run_number }})"
          body_path: app/RELEASE_NOTES.md
          prerelease: true
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: true

      - name: Generate Build Summary Report
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 📦 Interra Android Build Summary

          | Artifact | Format | Output Location | Status |
          |----------|--------|-----------------|--------|
          | **APK Release** | `.apk` | `app-release.apk` | ✅ SUCCESS |
          | **App Bundle** | `.aab` | `app-release.aab` | ✅ SUCCESS |

          > 🌐 **Release Tag**: `build-${{ github.run_number }}`
          EOF
